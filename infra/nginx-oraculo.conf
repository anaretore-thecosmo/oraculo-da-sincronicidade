# ============================================================================
# ITEM 1 DO ROADMAP — score ICE 800.
# Destino no repo: /var/www/oraculo/infra/nginx-oraculo.conf
#
# Esta e a copia FIEL do que roda hoje em /etc/nginx/sites-available/oraculo,
# tirada em 17/08/2026. Ela sustenta SSL, rate-limit, headers de seguranca e
# o proxy de /api/ — e existia apenas em /etc, fora de qualquer repositorio.
#
# Instalar:
#   cp infra/nginx-oraculo.conf /etc/nginx/sites-available/oraculo
#   nginx -t && systemctl reload nginx
#
# O nginx -t vem antes do reload de proposito: o Nginx so troca a config
# depois que o teste passa, entao config quebrada nao derruba o site. Foi
# assim que a falha de 16/08 nao virou incidente.
#
# ATENCAO ao item 8 do roadmap: o proxy_read_timeout de 300s aqui existe
# porque a narracao leva 150s dentro do request. Depois da narracao
# assincrona (item 7), este valor volta para 60s.
# ============================================================================

# =====================================================================
# NGINX — oraculo.portalthecosmo.com
# Destino: /etc/nginx/sites-available/oraculo
#
# ANTES de sobrescrever:
#   cp /etc/nginx/sites-available/oraculo /root/backup-nginx-oraculo-2026-08-16
#
# Mudanças em relação ao que está no ar hoje:
#   1. proxy_pass corrigido de :3001 (portal-reset-api-v2) para :3985 (oraculo-api)
#   2. rate-limit aplicado ao /api/
#   3. headers de segurança
#   4. timeout maior no /api/, porque leitura de IA demora
# =====================================================================

# Zona de limite. Vai no bloco http do /etc/nginx/nginx.conf, junto das
# zonas do ASTRA que já existem nas linhas 14 a 17:
#
#   limit_req_zone $binary_remote_addr zone=oraculo_ia:10m rate=10r/m;
#
# Sem isso, o limit_req abaixo não sobe.

server {
    server_name oraculo.portalthecosmo.com;
    root /var/www/oraculo/dist;
    index index.html;

    # --- headers de segurança, valem para todo o site ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- compressão ---
    # O nginx.conf tem `gzip on`, mas com `gzip_types` comentado: o padrão
    # comprime SÓ text/html. Medido em 02/09/2026, o bundle viajava com
    # 509.380 bytes crus, contra os 155,74 KB que o build reporta comprimido.
    # Aqui a lista é declarada para este site.
    #
    # WebP fica de fora de propósito: já é formato comprimido, e gastar CPU
    # recomprimindo as 114 artes não devolve byte nenhum.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # --- cache ---
    # Cache imutável SÓ no que tem hash no nome. O Vite gera
    # /assets/index-<hash>.js: mudou o conteúdo, muda o nome, então guardar
    # por um ano é seguro.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # As cartas NÃO têm hash no nome: maior-16.webp continua maior-16.webp
    # mesmo quando a arte é substituída — e isso aconteceu em 30/08, quando
    # A Torre foi reenviada. Por isso aqui é cache com revalidação, e não
    # imutável: uma semana de folga, e depois o ETag decide.
    location /cartas/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # --- a API do Oráculo, e só dela ---
    location /api/ {
        limit_req zone=oraculo_ia burst=5 nodelay;

        proxy_pass http://127.0.0.1:3985;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IA leva tempo. O padrão de 60s corta a resposta no meio.
        # A narração é a mais lenta: converte a leitura inteira em áudio e
        # devolve alguns MB de base64. Medido em 16/08: estourou 120s e o
        # Nginx respondeu 504 com uma página HTML, que o front tentou ler
        # como JSON. Daí os 300s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # Resposta de API nunca entra em cache: cada leitura é única.
        add_header Cache-Control "no-store" always;
    }

    # Atenção: add_header dentro de um location ANULA todos os add_header do
    # bloco server. Por isso os headers de segurança estão repetidos aqui.
    # Sem essa repetição, a home do site fica sem HSTS e sem X-Frame-Options,
    # porque o try_files do location / cai neste bloco por rewrite interno.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oraculo.portalthecosmo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oraculo.portalthecosmo.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = oraculo.portalthecosmo.com) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    server_name oraculo.portalthecosmo.com;
    return 404;
}
